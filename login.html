{% extends 'base.html' %}
{% block head %}
<style>
.auth-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100vh; padding: 20px;
}
.auth-card {
  background: var(--surface); border-radius: var(--r-card);
  box-shadow: var(--shadow-lg); padding: 32px 28px; width: 100%;
}
.auth-logo {
  text-align: center; margin-bottom: 28px;
}
.auth-logo-badge {
  width: 56px; height: 56px; border-radius: 18px;
  background: linear-gradient(135deg, var(--der), var(--das));
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 26px; color: #fff; font-weight: 800; margin-bottom: 10px;
}
.auth-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; text-align:center; }
.auth-sub   { font-size: 13px; color: var(--text2); text-align:center; margin-bottom: 24px; }
.auth-link  { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text2); }
.auth-link a { color: var(--der); font-weight: 700; text-decoration: none; }
.auth-link a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-badge">A</div>
      <div class="auth-title">Вхід до акаунту</div>
      <div class="auth-sub">ArtikelTrainer — вивчайте артиклі</div>
    </div>

    <form method="POST">
      <div class="field">
        <label>ЛОГІН</label>
        <input type="text" name="login" placeholder="your_login" required autofocus>
      </div>
      <div class="field">
        <label>ПАРОЛЬ</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Увійти</button>
    </form>

    <div class="auth-link">
      Немає акаунту? <a href="{{ url_for('register') }}">Зареєструватись</a>
    </div>
  </div>
</div>
{% endblock %}
